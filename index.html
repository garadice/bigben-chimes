<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Big Ben Chimes</title>
  <meta name="description" content="Skutočný Veľký Ben zvoní štvrťhodiny, pol chvíľu aj celé hodiny. Pre Matka.">
  <meta name="theme-color" content="#101a3c">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <img class="tower" src="photo/bigben.jpg" alt="Big Ben" draggable="false" aria-hidden="true">

  <button class="dial" id="btn-clock" aria-label="Vybrať hodinu" aria-haspopup="dialog"><time id="clock">--:--</time></button>

  <div class="count" id="count" aria-hidden="true"></div>
  <div class="armed" id="armed" aria-hidden="true"></div>

  <!-- kid-tappable column on the right edge; emoji only, nothing to read -->
  <nav class="pad" aria-label="Zvony">
    <button id="btn-q1" class="sq" aria-label="Štvrť (15 minút)">
      <span class="ico" aria-hidden="true">🕒</span>
    </button>
    <button id="btn-q2" class="sq" aria-label="Pol hodiny (30)">
      <span class="ico" aria-hidden="true">🕕</span>
    </button>
    <button id="btn-q3" class="sq" aria-label="Tri štvrte (45)">
      <span class="ico" aria-hidden="true">🕘</span>
    </button>
    <button id="btn-q4" class="sq" aria-label="Celá hodina (melódia)">
      <span class="ico" aria-hidden="true">🕛</span>
    </button>
    <button id="btn-bongs" class="sq" aria-label="Len bongy">
      <span class="ico" aria-hidden="true">🛎️</span>
    </button>
    <button id="btn-bells" class="sq" aria-label="Zvony na hranie" aria-haspopup="dialog">
      <span class="ico" aria-hidden="true">🎹</span>
    </button>
    <button id="btn-picker" class="sq" aria-label="Vybrať hodinu a zvoníť" aria-haspopup="dialog">
      <span class="ico" aria-hidden="true">🔔</span>
    </button>
    <button id="btn-quarter" class="sq toggle" aria-pressed="false" aria-label="Každú štvrť automaticky">
      <span class="ico" aria-hidden="true">⏰</span>
      <span class="dot" aria-hidden="true"></span>
    </button>
    <button id="btn-stop" class="sq stop" aria-label="Stop — hneď ticho">
      <span class="ico" aria-hidden="true">✋</span>
    </button>
  </nav>

  <!-- translucent hour picker: numbers 1–12, one big play button, photo shows through -->
  <div class="picker" id="picker" role="dialog" aria-modal="true" aria-label="Vybrať hodinu" aria-hidden="true">
    <button id="picker-close" class="pclose" aria-label="Zavrieť">✕</button>
    <button id="picker-stop" class="pclose pstop" aria-label="Stop — hneď ticho">✋</button>
    <div class="pgrid" role="group" aria-label="Hodiny">
      <button id="btn-p1" class="pnum" aria-label="Hodina 1">1</button>
      <button id="btn-p2" class="pnum" aria-label="Hodina 2">2</button>
      <button id="btn-p3" class="pnum" aria-label="Hodina 3">3</button>
      <button id="btn-p4" class="pnum" aria-label="Hodina 4">4</button>
      <button id="btn-p5" class="pnum" aria-label="Hodina 5">5</button>
      <button id="btn-p6" class="pnum" aria-label="Hodina 6">6</button>
      <button id="btn-p7" class="pnum" aria-label="Hodina 7">7</button>
      <button id="btn-p8" class="pnum" aria-label="Hodina 8">8</button>
      <button id="btn-p9" class="pnum" aria-label="Hodina 9">9</button>
      <button id="btn-p10" class="pnum" aria-label="Hodina 10">10</button>
      <button id="btn-p11" class="pnum" aria-label="Hodina 11">11</button>
      <button id="btn-p12" class="pnum" aria-label="Hodina 12">12</button>
    </div>
    <button id="picker-play" class="pplay" aria-disabled="true" aria-label="Zvoníť vybranú hodinu">▶</button>
  </div>

  <!-- ZVONKY play screen (v1.4.0): the tower's real quarter bells + the
       Great Bell (mode A), or an 11-bell E-major keyboard (mode B).
       Kid-first: icons, colors and numbers only, nothing to read. -->
  <div class="bells" id="bells" role="dialog" aria-modal="true" aria-label="Zvony na hranie" aria-hidden="true">
    <button id="bells-close" class="pclose" aria-label="Zavrieť">✕</button>
    <button id="bells-stop" class="pclose pstop" aria-label="Stop — hneď ticho">✋</button>
    <div class="bmodes" role="group" aria-label="Režim hrania">
      <button id="bells-mode-big" class="bmode" aria-pressed="true" aria-label="Veľké zvony">🔔</button>
      <button id="bells-mode-keys" class="bmode" aria-pressed="false" aria-label="Zvonová klávesnica">🎹</button>
    </div>

    <!-- mode A: five huge bells — the Great Bell dominant -->
    <div class="bell-stage" id="bell-stage" role="group" aria-label="Veľké zvony">
      <button id="bell-great" class="bigbell" aria-label="Veľký zvon">
        <span class="bico" aria-hidden="true">🔔</span>
      </button>
      <button id="bell-b3" class="qbell c-blue" aria-label="Zvon B3">
        <span class="bico" aria-hidden="true">🔔</span>
      </button>
      <button id="bell-e4" class="qbell c-red" aria-label="Zvon E4">
        <span class="bico" aria-hidden="true">🔔</span>
      </button>
      <button id="bell-fs4" class="qbell c-green" aria-label="Zvon F#4">
        <span class="bico" aria-hidden="true">🔔</span>
      </button>
      <button id="bell-gs4" class="qbell c-purple" aria-label="Zvon G#4">
        <span class="bico" aria-hidden="true">🔔</span>
      </button>
    </div>

    <!-- mode B: 11 numbered diatonic bells B3…E5; portrait = two staggered
         rows (6+5), landscape = one full-width row (display:contents) -->
    <div class="bkeys" id="bkeys" role="group" aria-label="Zvonová klávesnica" hidden>
      <div class="krow">
        <button id="key-b3" class="key c-blue" aria-label="Zvon 1 (B3)"><span class="num" aria-hidden="true">1</span></button>
        <button id="key-cs4" class="key c-pink" aria-label="Zvon 2 (C#4)"><span class="num" aria-hidden="true">2</span></button>
        <button id="key-ds4" class="key c-orange" aria-label="Zvon 3 (D#4)"><span class="num" aria-hidden="true">3</span></button>
        <button id="key-e4" class="key c-red" aria-label="Zvon 4 (E4)"><span class="num" aria-hidden="true">4</span></button>
        <button id="key-fs4" class="key c-green" aria-label="Zvon 5 (F#4)"><span class="num" aria-hidden="true">5</span></button>
        <button id="key-gs4" class="key c-purple" aria-label="Zvon 6 (G#4)"><span class="num" aria-hidden="true">6</span></button>
      </div>
      <div class="krow krow-b">
        <button id="key-a4" class="key c-teal" aria-label="Zvon 7 (A4)"><span class="num" aria-hidden="true">7</span></button>
        <button id="key-b4" class="key c-blue2" aria-label="Zvon 8 (B4)"><span class="num" aria-hidden="true">8</span></button>
        <button id="key-cs5" class="key c-pink2" aria-label="Zvon 9 (C#5)"><span class="num" aria-hidden="true">9</span></button>
        <button id="key-ds5" class="key c-orange2" aria-label="Zvon 10 (D#5)"><span class="num" aria-hidden="true">10</span></button>
        <button id="key-e5" class="key c-red2" aria-label="Zvon 11 (E5)"><span class="num" aria-hidden="true">11</span></button>
      </div>
    </div>
  </div>

  <div class="volwrap">
    <button id="btn-mute" aria-label="Ticho">🔊</button>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.9" aria-label="Hlasitosť">
  </div>

  <!-- update prompt: revealed by app.js only once a new release is already
       installed AND nothing is ringing; tap = reload -->
  <button id="update-banner" class="update" hidden>🔔 NOVÁ VERZIA — klepni</button>

  <p class="credit">📷 Diliff · zmenšené · CC BY 2.5<br>
    https://creativecommons.org/licenses/by/2.5/<br>
    🔔 Radio Oranje · 1. 1. 1945 · PD<br>
    🔔 Zvony na hranie: Lurie Carillon, Univ. of Michigan · CC BY 4.0<br>
    https://creativecommons.org/licenses/by/4.0/<br>
    <span id="version"></span></p>

  <script src="chime.js"></script>
  <script src="bells.js"></script>
  <script src="app.js"></script>
</body>
</html>
